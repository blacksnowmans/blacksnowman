<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고냥이 홍어 | 홍어네 링크</title>
<meta name="description" content="치즈냥 홍어의 유튜브·인스타그램, 그리고 홍어가 실제로 쓰는 물건 모음">
<meta name="robots" content="noindex">
<meta property="og:title" content="고냥이 홍어 | 홍어네 링크">
<meta property="og:description" content="홍어가 실제로 쓰는 물건 모음">
<meta property="og:image" content="avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ef; --card: #ffffff; --text: #3b2f25; --muted: #8a7b6d;
    --accent: #f59e0b; --accent-dark: #d97706; --line: #f1e4d3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Gowun Dodum", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; }
  .notice {
    font-size: 12px; color: var(--muted); background: #fdf1e1; border-radius: 10px;
    padding: 8px 12px; line-height: 1.5; margin-bottom: 20px;
  }
  .profile { text-align: center; margin-bottom: 20px; }
  .profile img {
    width: 104px; height: 104px; border-radius: 50%; object-fit: cover;
    border: 4px solid #fff; box-shadow: 0 4px 14px rgba(217,119,6,.25);
  }
  .profile h1 { font-size: 22px; margin: 12px 0 4px; }
  .profile p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .links { display: grid; gap: 10px; margin: 22px 0 28px; }
  .links a {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    text-decoration: none; font-size: 16px; font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,.04); transition: transform .1s;
  }
  .links a:active { transform: scale(.98); }
  .links a .ico { font-size: 22px; width: 28px; text-align: center; }
  .links a.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    text-decoration: none; color: var(--text); display: flex; flex-direction: column;
  }
  .item img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f6efe6; }
  .item .t { padding: 10px 10px 4px; font-size: 14px; font-weight: bold; line-height: 1.4; }
  .item .d { padding: 0 10px 12px; font-size: 12px; color: var(--muted); line-height: 1.4; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <div class="notice">이 페이지의 상품 링크는 쿠팡 파트너스·인플루언서 활동의 일환으로, 구매 시 일정액의 수수료를 제공받습니다.</div>

  <section class="profile">
    <img src="avatar.jpg" alt="치즈냥 홍어">
    <h1>고냥이 홍어 🐟</h1>
    <p>다섯 살 치즈 코리안숏헤어 홍어의 하루<br>꾹꾹이 · 식빵 · 우다다 매일 업로드</p>
  </section>

  <nav class="links" id="links"></nav>

  <h2>🐾 홍어가 쓰는 물건</h2>
  <div class="grid" id="items"></div>

  <footer>© 고냥이 홍어 · @hongeo_home</footer>
</main>
<script>
  // ── 여기만 고치면 됩니다 ───────────────────────────────
  const STORE = "https://influencers.coupang.com/s/hongeo_home";
  const LINKS = [
    { icon: "▶️", text: "홍어 유튜브", url: "https://www.youtube.com/@hongeo_home" },
    { icon: "📷", text: "홍어 인스타그램", url: "https://www.instagram.com/hongeo_home/" },
    { icon: "🛒", text: "홍어네 쿠팡 스토어 전체 보기", url: STORE, main: true },
  ];
  // url 을 비워 두면 쿠팡 스토어로 연결됩니다. 상품별 쿠팡 파트너스 링크가 있으면 넣어 주세요.
  const ITEMS = [
    { img: "p1.jpg", title: "홍어 최애 동결건조 간식", desc: "탐사 닭가슴살 240g", url: "" },
    { img: "p2.jpg", title: "추천 간식", desc: "선우글로벌 큐브팝 젤리", url: "" },
  ];
  // ────────────────────────────────────────────────────

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("links").innerHTML = LINKS.map(l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener${l.url.includes("coupang") ? " sponsored" : ""}"${l.main ? ' class="main"' : ""}>` +
    `<span class="ico">${l.icon}</span>${esc(l.text)}</a>`).join("");
  document.getElementById("items").innerHTML = ITEMS.map(i =>
    `<a class="item" href="${esc(i.url || STORE)}" target="_blank" rel="noopener sponsored">` +
    `<img src="${esc(i.img)}" alt="${esc(i.title)}" loading="lazy">` +
    `<span class="t">${esc(i.title)}</span><span class="d">${esc(i.desc)}</span></a>`).join("");
</script>
</body>
</html>
